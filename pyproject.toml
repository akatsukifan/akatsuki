[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "akatsuki-interpolate"
version = "0.1.0"
description = "Lightweight ffmpeg wrapper for video frame interpolation"
readme = "README.md"
authors = [{ name = "Akatsuki" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[project.scripts]
akatsuki-interpolate = "akatsuki_interpolate.cli:main"

[tool.setuptools]
packages = ["akatsuki_interpolate"]
include-package-data = true

[tool.setuptools.package-data]
"" = []
